services:
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.gomeslab.com.br"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: "warn"
      GOGC: "50"
    volumes:
      - /storage/grafana/data:/var/lib/grafana
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.30"
        reservations:
          memory: 80M

networks:
  webnet:
    external: true
