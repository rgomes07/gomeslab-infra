services:
  vaultwarden-db:
    image: postgres:16.6-alpine
    container_name: vaultwarden-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=30"
    volumes:
      - /storage/vaultwarden/postgres:/var/lib/postgresql/data
    networks:
      - vault_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.30"

  vaultwarden:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden
    restart: unless-stopped
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    environment:
      DOMAIN: "https://vault.gomeslab.com.br"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vaultwarden-db:5432/${POSTGRES_DB}"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      ROCKET_PORT: "80"
    volumes:
      - /storage/vaultwarden/data:/data
    networks:
      - vault_internal #(Rede interna com banco de dados postgrees)
      - webnet         # (Rede do proxy reverso - NGINX)
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.30"

networks:
  vault_internal:
    driver: bridge
    internal: true
  webnet:
    external: true
