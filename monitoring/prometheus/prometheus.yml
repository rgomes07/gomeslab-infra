global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'oci-host'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'vnic-docker-oci'

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'vnic-docker-oci'
