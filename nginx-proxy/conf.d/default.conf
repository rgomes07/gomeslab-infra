# Redireciona todo tráfego HTTP (porta 80) para HTTPS (porta 443)
server {
    listen 80;
    server_name gomeslab.com.br www.gomeslab.com.br _;
    return 301 https://$host$request_uri;
}

# Virtual Host Principal - HTTPS com Cloudflare Origin CA
server {
    listen 443 ssl;
    http2 on;
    server_name gomeslab.com.br www.gomeslab.com.br;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
